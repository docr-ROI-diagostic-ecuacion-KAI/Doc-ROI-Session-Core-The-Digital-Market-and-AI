name: Promote DOC ROI v23 to index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v23.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract embedded v23 presentation into index.html
        shell: python
        run: |
          from pathlib import Path
          import ast
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'const source = ("(?:\\.|[^"\\])*");', text, re.S)
          if not match:
              raise SystemExit('Embedded DOC ROI source was not found in index.html')

          presentation = ast.literal_eval(match.group(1))
          if '<title>The Digital Market and AI — DOC ROI · v23</title>' not in presentation:
              raise SystemExit('The embedded source is not DOC ROI v23')

          path.write_text(presentation, encoding='utf-8')

      - name: Commit production index
        run: |
          git config user.name 'DOC ROI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Deploy DOC ROI Digital Market session v23'
            git push
          fi
