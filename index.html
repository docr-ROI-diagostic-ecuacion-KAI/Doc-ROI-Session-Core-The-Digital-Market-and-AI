<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strategy Core Session · The Digital and AI Market</title>
<style>body{margin:0;background:#F6F7F9;color:#0B0F19;font-family:Inter,Helvetica,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.loading p{padding:24px;font-weight:700}</style>
</head>
<body>
<div class="loading"><p>Loading DOC ROI session…</p></div>
<noscript>This page requires JavaScript.</noscript>
<script>
(async()=>{
  const TARGET='https://doc-roi-internet-dynamics.vercel.app/';
  const paths=[0,1,2,3].map(i=>`assets/docroi/gzchunk${i}.txt`);
  const parts=await Promise.all(paths.map(async path=>{
    const response=await fetch(path,{cache:'no-store'});
    if(!response.ok) throw new Error(`Unable to load ${path}`);
    return (await response.text()).trim();
  }));
  const binary=atob(parts.join(''));
  const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();

  html=html.replace(/My\s+(?:Medicine|Medical)\s+Cabinet/gi,'My Cabinet');
  html=html.replace(/href=(['"])#internet-dynamics-practice\1/gi,`href="${TARGET}" target="_blank" rel="noopener"`);
  html=html.replace('https://docroi.marketing/wp-content/uploads/2026/07/937f2a27-909d-4c2c-831a-769b19ff0ed9.png','https://docroi.marketing/wp-content/uploads/2026/07/Triple-Loop.png');
  html=html.replace(/Customer\s+(?:Double|Triple)\s+Loop/g,'Customer Business Loop').replace(/double loop/gi,'Customer Business Loop');
  html=html.replace('</style>',`.double-loop-card.category-feedback::before,.category-feedback .double-loop-category{background:linear-gradient(90deg,#17275F 0%,#344A82 100%)}.customer-reference-note{margin:14px 0;padding:16px 18px;border:1px solid #C9D6E3;border-left:4px solid #10345B;background:#F4F7FA}.customer-reference-note strong{display:block;margin-bottom:6px;color:#0B1F3A;font-size:14px}.customer-reference-note p{margin:0;color:#566273;font-size:13px;line-height:1.55}</style>`);

  const patch=`<script>(()=>{const TARGET='${TARGET}';const fix=()=>{const anchors=[...document.querySelectorAll('a')];const a=anchors.find(x=>x.getAttribute('href')==='#internet-dynamics-practice'||/Go to the Internet Dynamics Vitamin/i.test(x.textContent));if(a){a.setAttribute('href',TARGET);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');if(!a.dataset.docRoiFixed){a.dataset.docRoiFixed='1';a.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();window.open(TARGET,'_blank','noopener');},true);}}const grid=document.querySelector('.double-loop-card-grid');if(grid&&!grid.dataset.docRoiFixed){const data=[['Acquisition','Buyer Persona','An evidence-based definition of the target customer profile, connected to a clear offer and acquisition strategy.'],['Acquisition','MQL','A Marketing Qualified Lead whose profile and behaviour indicate a relevant fit and measurable intention.'],['Acquisition','SQL','A Sales Qualified Lead ready for commercial management because fit, need and buying readiness have been validated.'],['Acquisition','Omnichannel','A coordinated customer experience across channels, messages and touchpoints, with continuity of context and data.'],['Acquisition','Sales','Conversion of the qualified opportunity into a customer relationship through a relevant value proposition and commercial process.'],['Loyalty','Customer Experience','Systematic improvement of each customer interaction to create a consistent, valuable and memorable relationship.'],['Loyalty','Data Ingestion and Normalisation','Capture, validation, cleaning and structuring of customer data so it can be used reliably across systems and decisions.'],['Loyalty','Segmentation','Grouping customers by behaviour, value, needs, risk, relationship stage and other relevant evidence.'],['Loyalty','Prioritised Actions (SPO)','Strategy Priority Operation: prioritising and executing the actions with the greatest expected impact, feasibility and relationship value.'],['Loyalty','Personalised Campaigns','Designing and activating relevant campaigns for each segment and customer context through evidence-based personalisation.'],['Feedback','Customer Insights and KPIs','Transforming customer behaviour, experience and performance data into learning, indicators and evidence for better decisions.'],['Feedback','Data Buyer Persona','The feedback output that returns customer evidence to acquisition. It is also the Digital Customer Twins action used to obtain and enrich the customer model.']];grid.innerHTML=data.map((d,i)=>'<article class="double-loop-card '+(i===10?'category-feedback':i===11?'category-data-buyer':i<5?'category-acquisition':'category-loyalty')+'"><div class="double-loop-card-head"><span class="double-loop-number">'+(i+1)+'</span><span class="double-loop-category">'+d[0]+'</span></div><h3>'+d[1]+'</h3><p>'+d[2]+'</p>'+(i===11?'<p class="double-loop-humble-note"><strong>DOC ROI contribution.</strong> A modest extension is to make point 12 explicit as the action that transforms loyalty evidence into a refreshed Data Buyer Persona for the next acquisition cycle.</p>':'')+'</article>').join('');grid.dataset.docRoiFixed='1';}const old=[...document.querySelectorAll('.key-card b')].find(x=>x.textContent.trim()==='8. Every speciality belongs to the same digital DNA');if(old){old.textContent='8. Triple Loop and Customer-Centric Management Architecture';old.nextElementSibling.textContent='The Triple Loop connects acquisition, loyalty and repurchase, and feedback and learning. The Customer-Centric Management Architecture aligns strategy, digital transformation and AI, administration and resource management, business, operations and KPI management around the same customer evidence.';}const practice=document.querySelector('[aria-label="DOC ROI practical prescriptions"].practice-grid');if(practice&&!document.querySelector('.customer-reference-note'))practice.outerHTML='<div class="customer-reference-note"><strong>Reference only · Buyer Persona and Decision Maker</strong><p>The Buyer Persona identifies the customer profile and context, while the Decision Maker identifies the person or role with authority to approve an organisational commitment. Their construction and practical application will be developed in a later subject.</p></div>';const reflection=document.querySelector('.final-kai-reflection');if(reflection&&!reflection.dataset.docRoiFixed){reflection.innerHTML='<span class="label">Final strategic reflection · KAI·ROI · φᵢ / Decision</span><strong>The Digital and AI Market creates value only when critical decisions are made with data, traceability, explicit hypotheses and expected return.</strong><p>In the official KAI·ROI v1 architecture, <span class="kai-symbol">φᵢ</span> represents Decision: the quality, maturity and decision-making capability associated with the unit analysed. Because φᵢ is a multiplicative component of KAIᵢ*, weak decision-making constrains value activation even when data, digitalisation, automation and AI are available.</p><p>This session therefore leads to one operational question: are critical decisions made using data, traceability, explicit hypotheses and expected return? A Data Buyer Persona or Decision Maker, a digitally mapped journey and reliable customer evidence are essential inputs to that decision, but they do not replace it.</p><p>The final strategic lesson is that digitalisation and AI must improve the quality of decisions so that the organisation can connect objectives, intelligence, customer signals, productivity, portfolio health and data monetisation with cost, WACC and Customer Equity.</p><p><em>This belongs to the operational implementation layer and does not replace the official KAI·ROI v1 formulation.</em></p><a href="https://docroi.marketing/kai-equation/" rel="noopener" target="_blank">Explore the official KAI·ROI Equation ↗</a>';reflection.dataset.docRoiFixed='1';}};fix();setTimeout(fix,0);setTimeout(fix,300);setTimeout(fix,1000);})();<\/script>`;
  html=html.replace('</body>',patch+'</body>');

  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.body.innerHTML='<main style="padding:32px;font-family:Inter,Helvetica,Arial,sans-serif"><h1>Unable to load the DOC ROI session</h1><p>Please refresh the page.</p></main>';
  console.error(error);
});
</script>
</body>
</html>
