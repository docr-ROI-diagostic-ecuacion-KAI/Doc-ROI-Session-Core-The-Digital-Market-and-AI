<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strategy Core Session · The Digital and AI Market</title>
<style>body{margin:0;background:#F6F7F9;color:#0B0F19;font-family:Inter,Helvetica,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.loading p{padding:24px;font-weight:700}</style>
</head>
<body>
<div class="loading"><p>Loading DOC ROI session…</p></div>
<noscript>This page requires JavaScript.</noscript>
<script>
(async()=>{
  const paths=[0,1,2,3].map(i=>`assets/docroi/gzchunk${i}.txt`);
  const parts=await Promise.all(paths.map(async path=>{
    const response=await fetch(path,{cache:'no-store'});
    if(!response.ok) throw new Error(`Unable to load ${path}`);
    return (await response.text()).trim();
  }));
  const binary=atob(parts.join(''));
  const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();

  html=html.replace(/My\s+(?:Medicine|Medical)\s+Cabinet/gi,'My Cabinet');

  html=html.replace(
    'https://docroi.marketing/wp-content/uploads/2026/07/937f2a27-909d-4c2c-831a-769b19ff0ed9.png',
    'https://docroi.marketing/wp-content/uploads/2026/07/Triple-Loop.png'
  );

  html=html.replace(/Customer\s+(?:Double|Triple)\s+Loop/g,'Customer Business Loop');
  html=html.replace(/double loop/gi,'Customer Business Loop');
  html=html.replace(
    '<span class="slide-kicker">McKinsey-Inspired Customer Business Loop</span>',
    '<span class="slide-kicker">Customer Business Loop</span>'
  );
  html=html.replace(
    'How does customer centricity create a Customer Business Loop between acquisition and loyalty?',
    'How does the Customer Business Loop connect acquisition, loyalty, repurchase and learning?'
  );
  html=html.replace(
    'Core concept · McKinsey-inspired Customer Business Loop',
    'Core concept · Customer Business Loop'
  );
  html=html.replace(
    'The acquisition loop converts demand into customers, while the loyalty loop turns customer experience and data into intelligence. DOC ROI closes the Customer Business Loop at point 12 by returning the most valuable customer patterns to a refined Data Buyer Persona for the next acquisition cycle.',
    'The Customer Business Loop connects acquisition, loyalty and repurchase, and feedback and learning. Point 12 returns the most valuable customer patterns to a refined Data Buyer Persona, improving the next acquisition cycle.'
  );
  html=html.replace(
    'Customer centricity creates a Customer Business Loop because acquisition generates customers, and loyalty reveals which customers are worth repeating, protecting and replicating in the next cycle.',
    'Customer centricity creates a Customer Business Loop by connecting acquisition with loyalty, repurchase, feedback and learning, so the next cycle begins with better customer evidence.'
  );

  html=html.replace('</style>', `
.double-loop-card.category-feedback::before{
  background:linear-gradient(90deg,#17275F 0%,#344A82 100%);
}
.category-feedback .double-loop-category{
  background:linear-gradient(90deg,#17275F 0%,#344A82 100%);
}
.customer-reference-note{
  margin:14px 0;
  padding:16px 18px;
  border:1px solid #C9D6E3;
  border-left:4px solid #10345B;
  background:#F4F7FA;
}
.customer-reference-note strong{
  display:block;
  margin-bottom:6px;
  color:#0B1F3A;
  font-size:14px;
}
.customer-reference-note p{
  margin:0;
  color:#566273;
  font-size:13px;
  line-height:1.55;
}
</style>`);

  const correctedGrid=`<div class="double-loop-card-grid">
<article class="double-loop-card category-acquisition">
<div class="double-loop-card-head"><span class="double-loop-number">1</span><span class="double-loop-category">Acquisition</span></div>
<h3>Buyer Persona</h3><p>An evidence-based definition of the target customer profile, connected to a clear offer and acquisition strategy.</p>
</article>
<article class="double-loop-card category-acquisition">
<div class="double-loop-card-head"><span class="double-loop-number">2</span><span class="double-loop-category">Acquisition</span></div>
<h3>MQL</h3><p>A Marketing Qualified Lead whose profile and behaviour indicate a relevant fit and measurable intention.</p>
</article>
<article class="double-loop-card category-acquisition">
<div class="double-loop-card-head"><span class="double-loop-number">3</span><span class="double-loop-category">Acquisition</span></div>
<h3>SQL</h3><p>A Sales Qualified Lead ready for commercial management because fit, need and buying readiness have been validated.</p>
</article>
<article class="double-loop-card category-acquisition">
<div class="double-loop-card-head"><span class="double-loop-number">4</span><span class="double-loop-category">Acquisition</span></div>
<h3>Omnichannel</h3><p>A coordinated customer experience across channels, messages and touchpoints, with continuity of context and data.</p>
</article>
<article class="double-loop-card category-acquisition">
<div class="double-loop-card-head"><span class="double-loop-number">5</span><span class="double-loop-category">Acquisition</span></div>
<h3>Sales</h3><p>Conversion of the qualified opportunity into a customer relationship through a relevant value proposition and commercial process.</p>
</article>
<article class="double-loop-card category-loyalty">
<div class="double-loop-card-head"><span class="double-loop-number">6</span><span class="double-loop-category">Loyalty</span></div>
<h3>Customer Experience</h3><p>Systematic improvement of each customer interaction to create a consistent, valuable and memorable relationship.</p>
</article>
<article class="double-loop-card category-loyalty">
<div class="double-loop-card-head"><span class="double-loop-number">7</span><span class="double-loop-category">Loyalty</span></div>
<h3>Data Ingestion and Normalisation</h3><p>Capture, validation, cleaning and structuring of customer data so it can be used reliably across systems and decisions.</p>
</article>
<article class="double-loop-card category-loyalty">
<div class="double-loop-card-head"><span class="double-loop-number">8</span><span class="double-loop-category">Loyalty</span></div>
<h3>Segmentation</h3><p>Grouping customers by behaviour, value, needs, risk, relationship stage and other relevant evidence.</p>
</article>
<article class="double-loop-card category-loyalty">
<div class="double-loop-card-head"><span class="double-loop-number">9</span><span class="double-loop-category">Loyalty</span></div>
<h3>Prioritised Actions (SPO)</h3><p>Strategy Priority Operation: prioritising and executing the actions with the greatest expected impact, feasibility and relationship value.</p>
</article>
<article class="double-loop-card category-loyalty">
<div class="double-loop-card-head"><span class="double-loop-number">10</span><span class="double-loop-category">Loyalty</span></div>
<h3>Personalised Campaigns</h3><p>Designing and activating relevant campaigns for each segment and customer context through evidence-based personalisation.</p>
</article>
<article class="double-loop-card category-feedback">
<div class="double-loop-card-head"><span class="double-loop-number">11</span><span class="double-loop-category">Feedback</span></div>
<h3>Customer Insights and KPIs</h3><p>Transforming customer behaviour, experience and performance data into learning, indicators and evidence for better decisions.</p>
</article>
<article class="double-loop-card category-data-buyer">
<div class="double-loop-card-head"><span class="double-loop-number">12</span><span class="double-loop-category">Feedback</span></div>
<h3>Data Buyer Persona</h3><p>The feedback output that returns customer evidence to acquisition. It is also the Digital Customer Twins action used to obtain and enrich the customer model.</p><p class="double-loop-humble-note"><strong>DOC ROI contribution.</strong> A modest extension is to make point 12 explicit as the action that transforms loyalty evidence into a refreshed Data Buyer Persona for the next acquisition cycle.</p>
</article>
</div>`;

  const gridStart=html.indexOf('<div class="double-loop-card-grid">');
  const convergenceStart=html.indexOf('<div class="convergence-note">',gridStart);
  if(gridStart!==-1 && convergenceStart!==-1){
    html=html.slice(0,gridStart)+correctedGrid+'\n</div>\n'+html.slice(convergenceStart);
  }

  html=html.replace(
    '<div class="key-card"><b>8. Every speciality belongs to the same digital DNA</b><p>Strategy, transformation, management, business, operations and KPI systems are different angles of the same customer-centred digital reality.</p></div>',
    '<div class="key-card"><b>8. Triple Loop and Customer-Centric Management Architecture</b><p>The Triple Loop connects acquisition, loyalty and repurchase, and feedback and learning. The Customer-Centric Management Architecture aligns strategy, digital transformation and AI, administration and resource management, business, operations and KPI management around the same customer evidence.</p></div>'
  );

  const customerReference=`<div class="customer-reference-note">
<strong>Reference only · Buyer Persona and Decision Maker</strong>
<p>The Buyer Persona identifies the customer profile and context, while the Decision Maker identifies the person or role with authority to approve an organisational commitment. Their construction and practical application will be developed in a later subject.</p>
</div>`;

  const practiceStart=html.indexOf('<div aria-label="DOC ROI practical prescriptions" class="practice-grid">');
  const bridgeStart=html.indexOf('<div class="bridge-box">',practiceStart);
  if(practiceStart!==-1 && bridgeStart!==-1){
    html=html.slice(0,practiceStart)+customerReference+'\n'+html.slice(bridgeStart);
  }

  const kaiDecisionReflection=`<div class="final-kai-reflection">
<span class="label">Final strategic reflection · KAI·ROI · φᵢ / Decision</span>
<strong>
  The Digital and AI Market creates value only when critical decisions are made with data, traceability, explicit hypotheses and expected return.
</strong>
<p>
  In the official KAI·ROI v1 architecture, <span class="kai-symbol">φᵢ</span> represents Decision: the quality, maturity and decision-making capability associated with the unit analysed. Because φᵢ is a multiplicative component of KAIᵢ*, weak decision-making constrains value activation even when data, digitalisation, automation and AI are available.
</p>
<p>
  This session therefore leads to one operational question: are critical decisions made using data, traceability, explicit hypotheses and expected return? A Data Buyer Persona or Decision Maker, a digitally mapped journey and reliable customer evidence are essential inputs to that decision, but they do not replace it.
</p>
<p>
  The final strategic lesson is that digitalisation and AI must improve the quality of decisions so that the organisation can connect objectives, intelligence, customer signals, productivity, portfolio health and data monetisation with cost, WACC and Customer Equity.
</p>
<p><em>This belongs to the operational implementation layer and does not replace the official KAI·ROI v1 formulation.</em></p>
<a href="https://docroi.marketing/kai-equation/" rel="noopener" target="_blank">
  Explore the official KAI·ROI Equation ↗
</a>
</div>`;

  html=html.replace(
    /<div class="final-kai-reflection">[\s\S]*?<\/div>\s*<div class="convergence-note">/,
    kaiDecisionReflection+'\n<div class="convergence-note">'
  );

  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.body.innerHTML='<main style="padding:32px;font-family:Inter,Helvetica,Arial,sans-serif"><h1>Unable to load the DOC ROI session</h1><p>Please refresh the page.</p></main>';
  console.error(error);
});
</script>
</body>
</html>
